<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncWatch — Watch Together</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a;
    --deep: #111114;
    --panel: #18181c;
    --border: #2a2a30;
    --gold: #e8b84b;
    --gold-dim: #a07d2a;
    --text: #e8e4dc;
    --muted: #7a7870;
    --red: #e05252;
    --green: #52c472;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── LOBBY ─────────────────────────────────── */
  #lobby {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  #lobby::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(232,184,75,0.07) 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(255,255,255,0.02) 80px),
      repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(255,255,255,0.02) 80px);
    pointer-events: none;
  }

  .lobby-card {
    position: relative;
    width: 420px;
    max-width: 95vw;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 48px 40px 40px;
    animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .lobby-card::before {
    content: '';
    position: absolute;
    top: 0; left: 40px; right: 40px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .logo {
    font-family: 'Bebas Neue', cursive;
    font-size: 3rem;
    letter-spacing: 0.08em;
    line-height: 1;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .logo span { color: var(--text); }

  .tagline {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .field-label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 20px;
    -webkit-appearance: none;
  }

  .field:focus { border-color: var(--gold); }
  .field::placeholder { color: var(--muted); }

  .room-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    margin-bottom: 20px;
  }

  .room-row .field { margin-bottom: 0; }

  .btn-gen {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0 14px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-gen:hover { border-color: var(--gold); color: var(--gold); }

  .btn-join {
    width: 100%;
    background: var(--gold);
    border: none;
    color: var(--ink);
    font-family: 'Bebas Neue', cursive;
    font-size: 1.1rem;
    letter-spacing: 0.12em;
    padding: 15px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 4px;
  }

  .btn-join:hover { opacity: 0.88; }
  .btn-join:active { transform: scale(0.99); }

  /* ── MAIN APP ───────────────────────────────── */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .topbar-logo {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    color: var(--gold);
  }

  .topbar-logo span { color: var(--text); }

  .room-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .room-badge .code {
    background: var(--ink);
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-family: monospace;
    font-size: 0.85rem;
    color: var(--gold);
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .room-badge .code:hover { border-color: var(--gold); }

  .member-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .member-count { color: var(--text); }

  .ws-status {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 0;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .ws-status.connected { color: var(--green); }
  .ws-status.disconnected { color: var(--red); }

  /* ── LAYOUT ─────────────────────────────────── */
  .main-layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    flex: 1;
    overflow: hidden;
  }

  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }

  /* ── VIDEO AREA ─────────────────────────────── */
  .video-area {
    display: flex;
    flex-direction: column;
    background: var(--ink);
    position: relative;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    max-height: calc(100vh - 200px);
    display: block;
  }

  .video-wrapper:fullscreen,
  .video-wrapper:-webkit-full-screen,
  .video-wrapper:-moz-full-screen,
  .video-wrapper:-ms-fullscreen {
    width: 100vw !important;
    height: 100vh !important;
    background: #000 !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  .video-wrapper:fullscreen video,
  .video-wrapper:-webkit-full-screen video,
  .video-wrapper:-moz-full-screen video,
  .video-wrapper:-ms-fullscreen video {
    width: 100vw !important;
    height: 100vh !important;
    max-height: 100vh !important;
    max-width: 100vw !important;
    object-fit: contain !important;
  }

  .drop-zone {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    cursor: pointer;
    transition: background 0.2s;
    z-index: 2;
  }

  .drop-zone.hidden { display: none; }

  .drop-zone:hover, .drop-zone.dragover {
    background: rgba(232,184,75,0.04);
  }

  .drop-icon {
    font-size: 3rem;
    opacity: 0.3;
  }

  .drop-text {
    text-align: center;
  }

  .drop-text strong {
    display: block;
    font-family: 'Bebas Neue', cursive;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .drop-text small {
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }

  #fileInput { display: none; }

  /* Sync flash overlay */
  .sync-flash {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }

  .sync-flash.show {
    animation: flashAnim 0.8s ease-out forwards;
  }

  @keyframes flashAnim {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }

  .sync-pill {
    background: rgba(0,0,0,0.75);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Bebas Neue', cursive;
    font-size: 1rem;
    letter-spacing: 0.15em;
    padding: 8px 20px;
    backdrop-filter: blur(6px);
  }

  /* ── CONTROLS ───────────────────────────────── */
  .controls {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 14px 20px 16px;
    flex-shrink: 0;
  }

  .progress-bar-track {
    width: 100%;
    height: 4px;
    background: var(--border);
    cursor: pointer;
    margin-bottom: 14px;
    position: relative;
    transition: height 0.15s;
  }

  .progress-bar-track:hover { height: 6px; }

  .progress-bar-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    pointer-events: none;
    position: relative;
  }

  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: -4px; top: 50%;
    transform: translateY(-50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .progress-bar-track:hover .progress-bar-fill::after { opacity: 1; }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  .ctrl-btn:hover { color: var(--gold); }
  .ctrl-btn:active { transform: scale(0.9); }
  .ctrl-btn svg { display: block; }

  .play-btn {
    width: 40px; height: 40px;
    background: var(--gold);
    color: var(--ink);
    border-radius: 0;
    padding: 0;
  }

  .play-btn:hover { background: #f0c55a; color: var(--ink); }

  .time-display {
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
    margin-left: 4px;
  }

  .time-display b { color: var(--text); font-weight: 400; }

  .ctrl-spacer { flex: 1; }

  .volume-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 80px;
    height: 3px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: var(--gold);
    border-radius: 50%;
  }

  /* ── SIDEBAR ────────────────────────────────── */
  .sidebar {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .chat-feed {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }

  .chat-feed::-webkit-scrollbar { width: 3px; }
  .chat-feed::-webkit-scrollbar-thumb { background: var(--border); }

  .chat-msg {
    font-size: 0.83rem;
    line-height: 1.45;
    animation: msgIn 0.2s ease-out both;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .chat-msg .author {
    color: var(--gold);
    font-weight: 500;
    font-size: 0.75rem;
    margin-bottom: 2px;
  }

  .chat-msg.system {
    color: var(--muted);
    font-style: italic;
    font-size: 0.75rem;
    text-align: center;
    padding: 2px 0;
  }

  .chat-input-row {
    display: flex;
    border-top: 1px solid var(--border);
  }

  .chat-input-row input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    padding: 12px 14px;
    outline: none;
  }

  .chat-input-row input::placeholder { color: var(--muted); }

  .chat-send {
    background: none;
    border: none;
    border-left: 1px solid var(--border);
    color: var(--muted);
    padding: 0 14px;
    cursor: pointer;
    transition: color 0.2s;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .chat-send:hover { color: var(--gold); }

  /* toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--panel);
    border: 1px solid var(--gold);
    color: var(--text);
    font-size: 0.82rem;
    padding: 9px 18px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    z-index: 999;
    white-space: nowrap;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- ══ LOBBY ══════════════════════════════════════════ -->
<div id="lobby">
  <div class="lobby-card">
    <div class="logo">Sync<span>Watch</span></div>
    <div class="tagline">Watch together — in perfect sync</div>

    <label class="field-label" for="nameInput">Your Name</label>
    <input class="field" id="nameInput" type="text" placeholder="e.g. Rahul" maxlength="20" autocomplete="off">

    <label class="field-label">Room Code</label>
    <div class="room-row">
      <input class="field" id="roomInput" type="text" placeholder="e.g. MOVIE1" maxlength="8"
        style="text-transform:uppercase" autocomplete="off">
      <button class="btn-gen" onclick="generateCode()">Generate</button>
    </div>

    <label class="field-label" for="serverInput">Server URL</label>
    <input class="field" id="serverInput" type="text" placeholder="ws://localhost:3000" autocomplete="off">

    <button class="btn-join" onclick="joinRoom()">▶ &nbsp; Enter Room</button>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">Sync<span>Watch</span></div>
    <div class="room-badge">
      <div class="member-dot"></div>
      <span class="member-count" id="memberCount">1 watching</span>
      <span style="color:var(--muted)">·</span>
      Room
      <div class="code" id="roomCode" title="Click to copy" onclick="copyRoomCode()">----</div>
    </div>
    <div class="ws-status disconnected" id="wsStatus">Connecting…</div>
  </div>

  <div class="main-layout">
    <!-- VIDEO -->
    <div class="video-area">
      <div class="video-wrapper">
        <video id="video" preload="auto"></video>

        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <div class="drop-icon">🎬</div>
          <div class="drop-text">
            <strong>Drop your video here</strong>
            <small>Everyone loads the same file independently · MP4, MKV, WebM, AVI…</small>
          </div>
        </div>
        <input type="file" id="fileInput" accept="video/*">

        <div class="sync-flash" id="syncFlash">
          <div class="sync-pill" id="syncPillText">SYNCED</div>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <div class="progress-bar-track" id="progressTrack">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="controls-row">
          <!-- Replay 10s -->
          <button class="ctrl-btn" title="Back 10s" onclick="skipBy(-10)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
              <text x="8.5" y="15" font-size="6" fill="currentColor" stroke="none" font-family="DM Sans">10</text>
            </svg>
          </button>

          <!-- Play/Pause -->
          <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">
            <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5,3 19,12 5,21"/>
            </svg>
          </button>

          <!-- Forward 10s -->
          <button class="ctrl-btn" title="Forward 10s" onclick="skipBy(10)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-3.5"/>
              <text x="8.5" y="15" font-size="6" fill="currentColor" stroke="none" font-family="DM Sans">10</text>
            </svg>
          </button>

          <span class="time-display"><b id="curTime">0:00</b> / <span id="durTime">0:00</span></span>

          <div class="ctrl-spacer"></div>

          <!-- Volume -->
          <div class="volume-group">
            <button class="ctrl-btn" onclick="toggleMute()" title="Mute">
              <svg id="volIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path id="volWave" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
            <input type="range" id="volSlider" min="0" max="1" step="0.02" value="1"
              oninput="setVolume(this.value)">
          </div>

          <!-- Fullscreen -->
          <button class="ctrl-btn" onclick="toggleFS()" title="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- SIDEBAR / CHAT -->
    <div class="sidebar">
      <div class="sidebar-header">Live Chat</div>
      <div class="chat-feed" id="chatFeed"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Say something…" maxlength="200"
          onkeydown="if(event.key==='Enter') sendChat()">
        <button class="chat-send" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── STATE ────────────────────────────────────────────
let ws = null;
let myName = '';
let myRoom = '';
let isRemoteAction = false; // prevent echo loop
let hasVideo = false;

const video   = document.getElementById('video');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');

// ── LOBBY ────────────────────────────────────────────
function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('roomInput').value = code;
}

// Auto-fill server URL
window.addEventListener('load', () => {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  document.getElementById('serverInput').value = `${proto}//${location.host}`;
  generateCode();
});

function joinRoom() {
  const name = document.getElementById('nameInput').value.trim();
  const room = document.getElementById('roomInput').value.trim().toUpperCase();
  const server = document.getElementById('serverInput').value.trim();

  if (!name) { toast('Enter your name first!'); return; }
  if (!room)  { toast('Enter a room code!'); return; }
  if (!server){ toast('Enter server URL!'); return; }

  myName = name;
  myRoom = room;

  document.getElementById('lobby').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('roomCode').textContent = room;

  connectWS(server, room, name);
  setupVideoEvents();
  setupDrop();
}

function copyRoomCode() {
  navigator.clipboard.writeText(myRoom).then(() => toast('Room code copied!'));
}

// ── WEBSOCKET ────────────────────────────────────────
function connectWS(server, room, name) {
  const url = `${server}/?room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    setStatus('connected', '● Connected');
    addSystemMsg('Connected to room ' + room);

    // Send current video state on reconnect so server is up to date
    if (hasVideo && !video.paused) {
      sendWS({ type: 'play', currentTime: video.currentTime });
    } else if (hasVideo) {
      sendWS({ type: 'pause', currentTime: video.currentTime });
    }

    // Heartbeat to keep WS alive (prevents 4-5 min idle disconnect)
    if (ws._pingInterval) clearInterval(ws._pingInterval);
    ws._pingInterval = setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 30000);
  };

  ws.onclose = () => {
    setStatus('disconnected', '○ Disconnected');
    addSystemMsg('Disconnected — trying to reconnect…');
    if (ws._pingInterval) clearInterval(ws._pingInterval);
    setTimeout(() => connectWS(server, room, name), 3000);
  };

  ws.onerror = () => setStatus('disconnected', '○ Error');

  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);
    handleServerMsg(msg);
  };
}

function handleServerMsg(msg) {
  if (msg.memberCount !== undefined) {
    const n = msg.memberCount;
    document.getElementById('memberCount').textContent = n + (n === 1 ? ' watching' : ' watching');
  }

  switch (msg.type) {
    case 'sync':
      // Initial sync when joining — only apply if difference is significant
      if (hasVideo) {
        const diff = Math.abs(video.currentTime - msg.currentTime);
        isRemoteAction = true;
        // Only seek if out of sync by more than 2 seconds
        if (diff > 2) video.currentTime = msg.currentTime;
        if (msg.playing) video.play().catch(() => {});
        else video.pause();
        setTimeout(() => { isRemoteAction = false; }, 500);
        showSyncFlash('SYNCED TO ROOM');
      }
      break;

    case 'play':
      if (!hasVideo) break;
      isRemoteAction = true;
      video.currentTime = msg.currentTime;
      video.play().catch(() => {});
      setTimeout(() => { isRemoteAction = false; }, 500);
      showSyncFlash(`▶ ${msg.by} played`);
      break;

    case 'pause':
      if (!hasVideo) break;
      isRemoteAction = true;
      video.currentTime = msg.currentTime;
      video.pause();
      setTimeout(() => { isRemoteAction = false; }, 500);
      showSyncFlash(`⏸ ${msg.by} paused`);
      break;

    case 'seek':
      if (!hasVideo) break;
      isRemoteAction = true;
      video.currentTime = msg.currentTime;
      setTimeout(() => { isRemoteAction = false; }, 500);
      showSyncFlash(`⏭ ${msg.by} seeked`);
      break;

    case 'member_update':
      if (msg.joined) addSystemMsg(`${msg.joined} joined the room`);
      if (msg.left)   addSystemMsg(`${msg.left} left the room`);
      break;

    case 'chat':
      addChatMsg(msg.by, msg.text, msg.by === myName);
      break;
  }
}

function sendWS(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ── VIDEO EVENTS ─────────────────────────────────────
function setupVideoEvents() {
  video.addEventListener('play', () => {
    updatePlayIcon(true);
    if (isRemoteAction) return;
    sendWS({ type: 'play', currentTime: video.currentTime });
  });

  video.addEventListener('pause', () => {
    updatePlayIcon(false);
    if (isRemoteAction) return;
    sendWS({ type: 'pause', currentTime: video.currentTime });
  });

  let seekTimeout = null;
  video.addEventListener('seeked', () => {
    if (isRemoteAction) return;
    clearTimeout(seekTimeout);
    seekTimeout = setTimeout(() => {
      sendWS({ type: 'seek', currentTime: video.currentTime });
    }, 300);
  });

  video.addEventListener('timeupdate', () => {
    const pct = video.duration ? (video.currentTime / video.duration) * 100 : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('curTime').textContent = fmtTime(video.currentTime);
    document.getElementById('durTime').textContent = fmtTime(video.duration || 0);
  });
}

// ── FILE DROP ─────────────────────────────────────────
function setupDrop() {
  const dz = document.getElementById('dropZone');
  const fi = document.getElementById('fileInput');

  fi.addEventListener('change', e => loadFile(e.target.files[0]));

  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });
}

function loadFile(file) {
  if (!file || !file.type.startsWith('video/')) {
    toast('Please load a video file!');
    return;
  }
  const url = URL.createObjectURL(file);
  video.src = url;
  hasVideo = true;
  document.getElementById('dropZone').classList.add('hidden');
  toast(`Loaded: ${file.name}`);

  // Sync to room state after metadata loads
  video.addEventListener('loadedmetadata', () => {
    sendWS({ type: '__requestSync' });
  }, { once: true });
}

// ── CONTROLS ─────────────────────────────────────────
function togglePlay() {
  if (!hasVideo) { toast('Load a video file first!'); return; }
  if (video.paused) video.play();
  else video.pause();
}

function skipBy(sec) {
  if (!hasVideo) return;
  video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + sec));
}

document.getElementById('progressTrack').addEventListener('click', function(e) {
  if (!hasVideo || !video.duration) return;
  const rect = this.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  video.currentTime = pct * video.duration;
});

function setVolume(v) {
  video.volume = v;
  video.muted = (v == 0);
  document.getElementById('volWave').style.opacity = v == 0 ? 0 : 1;
}

function toggleMute() {
  video.muted = !video.muted;
  document.getElementById('volSlider').value = video.muted ? 0 : video.volume;
  document.getElementById('volWave').style.opacity = video.muted ? 0 : 1;
}

function toggleFS() {
  const wrapper = document.querySelector('.video-wrapper');
  if (!document.fullscreenElement) {
    (video.requestFullscreen
      ? video.requestFullscreen()
      : wrapper.requestFullscreen()
    ).catch(() => {});
  } else {
    document.exitFullscreen();
  }
}

function updatePlayIcon(playing) {
  playIcon.innerHTML = playing
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="5,3 19,12 5,21"/>';
}

// ── CHAT ─────────────────────────────────────────────
function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  sendWS({ type: 'chat', text });
  input.value = '';
}

function addChatMsg(author, text, isMine) {
  const feed = document.getElementById('chatFeed');
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `<div class="author" style="${isMine ? 'color:var(--text)' : ''}">${esc(author)}</div>${esc(text)}`;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function addSystemMsg(text) {
  const feed = document.getElementById('chatFeed');
  const div = document.createElement('div');
  div.className = 'chat-msg system';
  div.textContent = text;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

// ── UTILS ─────────────────────────────────────────────
function setStatus(cls, text) {
  const el = document.getElementById('wsStatus');
  el.className = 'ws-status ' + cls;
  el.textContent = text;
}

function showSyncFlash(text) {
  const flash = document.getElementById('syncFlash');
  document.getElementById('syncPillText').textContent = text;
  flash.classList.remove('show');
  void flash.offsetWidth; // reflow
  flash.classList.add('show');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
